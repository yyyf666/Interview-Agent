# =====================================================
# 生产编排（独立文件，不继承 docker-compose.yml）
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 与开发编排的关键差异：
# 1. 只有 web(nginx) 暴露宿主端口（80）；java / python-ai / postgres / redis 均不映射，
#    外部无法直连 8000 / 8080 / 5432 / 6379。
# 2. 密钥全部必填（compose 的 ${VAR:?} 语法）：缺任一项直接拒绝启动，
#    Java 侧还有 StartupConfigValidator 在 prod profile 下二次校验。
# 3. code-runner 只挂隔离的 internal 网络（无公网出口），并做 cap/只读/进程数加固。
# 4. restart: always + 结构化日志上限，避免日志撑爆磁盘。
#
# 准备：cp .env.example .env 并填写全部必填项。
# =====================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必填}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填（禁止使用默认值）}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 必填}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options: { max-size: "20m", max-file: "3" }

  redis:
    image: redis:7-alpine
    container_name: interview-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options: { max-size: "20m", max-file: "3" }

  java-backend:
    build:
      context: ./java-backend
    container_name: interview-java-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://python-ai:8000
      APP_FILE_STORAGE_PATH: /data/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS 必填（生产域名）}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET 必填（≥32字节随机串）}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?APP_INTERNAL_TOKEN 必填（与 python-ai 共享）}
      # 上下文压缩：最近 N 轮问答保留全文，更早轮次只传评分摘要
      APP_FULL_HISTORY_TURNS: ${APP_FULL_HISTORY_TURNS:-5}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options: { max-size: "20m", max-file: "3" }

  python-ai:
    build:
      context: ./python-ai
    container_name: interview-python-ai
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 必填}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ASR_API_BASE: ${ASR_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ASR_API_KEY: ${ASR_API_KEY:-${DASHSCOPE_API_KEY:-}}
      ASR_MODEL: ${ASR_MODEL:-paraformer-8k-v1}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      # 重排实现：auto=本地优先再回退 DashScope API；local/api/none 强制指定
      RERANK_PROVIDER: ${RERANK_PROVIDER:-auto}
      RERANK_API_MODEL: ${RERANK_API_MODEL:-gte-rerank-v2}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      # 评测降本：主评/清单并发线程池、边界双评委抽样比例、极端分复核开关
      EVAL_POOL_SIZE: ${EVAL_POOL_SIZE:-16}
      EVAL_DOUBLE_JUDGE_RATIO: ${EVAL_DOUBLE_JUDGE_RATIO:-0.2}
      EVAL_EXTREME_RECHECK: ${EVAL_EXTREME_RECHECK:-true}
      # RAG 结果缓存（秒级 TTL，索引写入时主动失效）
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_CACHE_TTL: ${RAG_CACHE_TTL:-600}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_FILE_STORAGE_PATH: /data/uploads
      SKILLS_DIR: /skills
    volumes:
      - ./data/uploads:/data/uploads
      - ./skills:/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options: { max-size: "20m", max-file: "3" }

  code-runner:
    build:
      context: ./code-runner
    container_name: interview-code-runner
    restart: always
    environment:
      RUN_TIMEOUT: "6"
      RUN_MEM_LIMIT_MB: "256"
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_MAX_CONCURRENCY: "2"
      RUN_MAX_CODE_BYTES: "200000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # 资源与进程数上限统一写在 deploy.resources.limits（与服务级 pids_limit 互斥，新版 Compose 会报错）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
    logging:
      options: { max-size: "20m", max-file: "3" }

  web:
    image: nginx:1.25-alpine
    container_name: interview-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - default
      - sandbox
    depends_on:
      - java-backend
      - code-runner
    logging:
      options: { max-size: "20m", max-file: "3" }

networks:
  default:
  sandbox:
    internal: true

volumes:
  pg_data:
  redis_data:
