server:
  port: 8080

spring:
  application:
    name: interview-java-backend
  threads:
    virtual:
      enabled: true   # Java 21 虚拟线程
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_agent?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:interview}
    password: ${SPRING_DATASOURCE_PASSWORD:interview123}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Python AI 能力层地址
  ai-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  # 本地文件存储目录（与容器挂载路径一致）
  storage-path: ${APP_FILE_STORAGE_PATH:./data/uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    timeout-seconds: 120
    # 与 python-ai 共享的内部调用密钥：AI 层将拒绝未携带 X-Internal-Token 的请求。
    # 本地开发有默认值开箱即用；生产 profile 下 StartupConfigValidator 会拒绝默认值启动。
    internal-token: ${APP_INTERNAL_TOKEN:interview-agent-local-dev-internal-token}
  context:
    # 上下文压缩：最近 N 轮问答保留全文，更早轮次只传评分摘要（长会话 prompt 不随轮次膨胀）
    full-history-turns: ${APP_FULL_HISTORY_TURNS:5}
  jwt:
    # HS256 密钥（访问令牌 30 分钟），生产必须覆盖（≥32字节）
    secret: ${APP_JWT_SECRET:interview-agent-local-dev-secret-key-32bytes}

logging:
  level:
    com.interview.agent: INFO
  pattern:
    # 全链路 Trace：MDC traceId 由 TraceIdFilter 注入，与 Python 层 X-Trace-Id 串联
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] --- [%15.15t] %-40.40logger{39} : %m%n"
