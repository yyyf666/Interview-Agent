# WebSocket 升级连接头映射（http 上下文，conf.d 文件整体位于 http 内）
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 实时语音 WebSocket（需在通用 /api/ 之前匹配，开启协议升级）
    location /api/ws/ {
        proxy_pass http://java-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 业务后端 API 网关
    location /api/ {
        proxy_pass http://java-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
        proxy_read_timeout 300s;   # LLM链路耗时较长
        # SSE 流式作答（R-16）：关闭缓冲，保证 stage 事件实时下发
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
    }

    # 代码题沙箱运行（code-runner 服务）
    location = /run {
        proxy_pass http://code-runner:8090/run;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
