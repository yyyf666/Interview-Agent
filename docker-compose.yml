services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview123}
      POSTGRES_DB: ${POSTGRES_DB:-interview_agent}
    ports:
      # 仅本机可连（避免开发机在局域网/公共网络暴露数据库）
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview} -d ${POSTGRES_DB:-interview_agent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: interview-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  java-backend:
    build:
      context: ./java-backend
    container_name: interview-java-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview_agent}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-interview}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-interview123}
      SPRING_DATA_REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://python-ai:8000
      APP_FILE_STORAGE_PATH: /data/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-interview-agent-local-dev-secret-key-32bytes}
      # 与 python-ai 共享的内部调用密钥（两边必须一致，否则 AI 层 401）
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:-interview-agent-local-dev-internal-token}
      # 上下文压缩：最近 N 轮问答保留全文，更早轮次只传评分摘要
      APP_FULL_HISTORY_TURNS: ${APP_FULL_HISTORY_TURNS:-5}
    ports:
      # 宿主端口可覆盖：本机 8080 被其他服务（如 Nacos）占用时，用 JAVA_HOST_PORT=18080 启动
      # 前端仍走 nginx（3000）→ 服务名 java-backend:8080，不受宿主端口影响
      - "127.0.0.1:${JAVA_HOST_PORT:-8080}:8080"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  python-ai:
    build:
      context: ./python-ai
    container_name: interview-python-ai
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-interview_agent}
      DATABASE_USER: ${POSTGRES_USER:-interview}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-interview123}
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${DASHSCOPE_API_KEY:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      ASR_API_BASE: ${ASR_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ASR_API_KEY: ${ASR_API_KEY:-${DASHSCOPE_API_KEY:-}}
      ASR_MODEL: ${ASR_MODEL:-paraformer-8k-v1}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      # 重排实现：auto=本地优先再回退 DashScope API；local/api/none 强制指定
      RERANK_PROVIDER: ${RERANK_PROVIDER:-auto}
      RERANK_API_MODEL: ${RERANK_API_MODEL:-gte-rerank-v2}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      # 评测降本：主评/清单并发线程池、边界双评委抽样比例、极端分复核开关
      EVAL_POOL_SIZE: ${EVAL_POOL_SIZE:-16}
      EVAL_DOUBLE_JUDGE_RATIO: ${EVAL_DOUBLE_JUDGE_RATIO:-0.2}
      EVAL_EXTREME_RECHECK: ${EVAL_EXTREME_RECHECK:-true}
      # RAG 结果缓存（秒级 TTL，索引写入时主动失效）
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_CACHE_TTL: ${RAG_CACHE_TTL:-600}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      # 内网鉴权：只接受携带此后端密钥的调用（Java 统一注入）
      INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:-interview-agent-local-dev-internal-token}
      CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_FILE_STORAGE_PATH: /data/uploads
      SKILLS_DIR: /skills
    ports:
      # 仅本机可连：AI 层不应暴露到局域网/公网（前端统一走 nginx → Java → 本层）
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/uploads:/data/uploads
      - ./skills:/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  code-runner:
    build:
      context: ./code-runner
    container_name: interview-code-runner
    environment:
      RUN_TIMEOUT: "6"
      RUN_MEM_LIMIT_MB: "256"
      # 只读根文件系统下禁止写 __pycache__，否则 import 阶段会失败
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_MAX_CONCURRENCY: "2"
      RUN_MAX_CODE_BYTES: "200000"
    # 安全加固：无特权、根文件系统只读、仅 /tmp 可写；资源与进程数上限统一写在 deploy.resources.limits
    # （服务级 pids_limit 与 deploy.resources.limits 在新版 Compose 中会互相冲突，统一收拢到一处）
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    # 只接入隔离的 sandbox 网络（internal: true）：
    # - 可达方：仅 web(nginx) 的 /run 反向代理，业务后端/DB/Redis/AI 均不可达
    # - 无公网出口：避免用户代码作为出网跳板
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  web:
    image: nginx:1.25-alpine
    container_name: interview-web
    ports:
      - "3000:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - default
      - sandbox
    depends_on:
      - java-backend
      - code-runner

networks:
  default:
  # 沙箱专用：internal=true 阻断公网出口；只有 code-runner 与 web 在内
  sandbox:
    internal: true

volumes:
  pg_data:
  redis_data:
